
name: Criar APK do CapCut 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: capcut2-preparado-para-apk/capcut2-apk-build

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar arquivos
        run: |
          pwd
          ls -la
          test -f package.json
          test -f capacitor.config.json

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-2-APK
          path: capcut2-preparado-para-apk/capcut2-apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
