name: Criar APK Nativo do CapCut 2

on:
  workflow_dispatch:
  push:
    paths:
      - 'capcut2-native-android/capcut2-native/**'
      - '.github/workflows/build-native-apk.yml'

jobs:
  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: capcut2-native-android/capcut2-native
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK nativo
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CapCut2-Nativo-Light-APK
          path: capcut2-native-android/capcut2-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
